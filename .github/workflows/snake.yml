# ---------------------------------------------------------------------------
# snake.yml - contribution snake animation (Platane/snk)
#
# THIS WORKFLOW IS COMMITTED DISABLED ON PURPOSE.
#
# The account erfzrezr currently has no contribution history. A snake animation
# generated from an empty contribution grid renders as a blank green-less strip,
# which looks worse than having no animation at all.
#
# HOW TO ENABLE (do this after roughly three months of steady commits, when the
# contribution graph on https://github.com/erfzrezr has visible density):
#   1. Uncomment the `schedule:` block below.
#   2. Commit and push. The first run also happens on the next cron tick; use the
#      Actions tab -> snake -> "Run workflow" to trigger it immediately.
#   3. Add the images to the profile README (they live on the `output` branch):
#        <picture>
#          <source media="(prefers-color-scheme: dark)"
#            srcset="https://raw.githubusercontent.com/erfzrezr/erfzrezr/output/github-snake-dark.svg">
#          <img alt="contribution snake"
#            src="https://raw.githubusercontent.com/erfzrezr/erfzrezr/output/github-snake.svg">
#        </picture>
#
# Notes:
#   - Uses only the built-in GITHUB_TOKEN. No secret to configure.
#   - Writes to the orphan branch `output`. It never touches `main`.
#   - Actions are pinned to major version tags.
# ---------------------------------------------------------------------------

name: snake

on:
  # Manual only while the contribution graph is empty.
  workflow_dispatch:

  # ENABLE ME LATER: runs every 12 hours.
  # schedule:
  #   - cron: "0 */12 * * *"

# Least privilege: the job pushes generated SVGs to the `output` branch,
# so it needs contents:write and nothing else.
permissions:
  contents: write

# One snake run at a time. Do not cancel a run that is mid-push.
concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake (light + dark)
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
