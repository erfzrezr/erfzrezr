# ---------------------------------------------------------------------------
# metrics.yml - profile metrics image (lowlighter/metrics)
#
# Renders github-metrics.svg into the root of this repository. The profile
# README can then embed it with:
#   <img alt="profile metrics"
#     src="https://raw.githubusercontent.com/erfzrezr/erfzrezr/main/github-metrics.svg">
#
# THIS WORKFLOW IS COMMITTED MANUAL-ONLY ON PURPOSE.
# --------------------------------------------------
# The `base: header, activity, community, repositories, metadata` output below is
# built from public repositories and contribution activity. The account erfzrezr
# currently has neither, so a scheduled run would commit an almost empty stats image
# and keep refreshing it. Same reasoning as snake.yml, which is gated the same way.
#
# HOW TO ENABLE (do this after roughly three months of commits and at least one
# public repository, once https://github.com/erfzrezr has something to summarise):
#   1. Add the METRICS_TOKEN secret, as described below.
#   2. Uncomment the `schedule:` block in the `on:` section.
#   3. Commit and push, then run it once by hand from the Actions tab.
#   4. Add the <img> line above to the profile README.
# A manual "Run workflow" is safe at any time and is the way to preview the output
# before committing to a schedule.
#
# REQUIRED SECRET: METRICS_TOKEN
# ------------------------------
# lowlighter/metrics cannot use the built-in GITHUB_TOKEN, because that token is
# scoped to this repository only and cannot read account-level data.
#
#   1. Create a classic personal access token:
#        https://github.com/settings/tokens/new?scopes=read:user&description=METRICS_TOKEN
#      Scopes:
#        read:user  - required. Lets the action read the profile, followers, and
#                     public activity.
#        repo       - OPTIONAL. Only add this if you want private repositories
#                     counted in the language / commit statistics. It grants full
#                     read/write access to all your repositories, so leave it off
#                     unless you actually need private stats.
#      Expiration: set a date you will remember (90 days is a reasonable default)
#      and diary a reminder to rotate it. The workflow fails loudly when the token
#      expires, it does not silently produce a stale image.
#
#   2. Store it as a repository secret named METRICS_TOKEN:
#        https://github.com/erfzrezr/erfzrezr/settings/secrets/actions/new
#      Name:  METRICS_TOKEN
#      Value: the token string from step 1
#
#   3. Trigger a first run: Actions tab -> metrics -> "Run workflow".
#
# Until the secret exists this workflow will fail on the metrics step. That is
# expected and harmless; nothing else in the repository depends on it.
#
# Action pinned to a patch version tag so plugin behaviour cannot change under us.
# ---------------------------------------------------------------------------

name: metrics

on:
  # Manual only while the account has no public repositories and no activity.
  workflow_dispatch:

  # ENABLE ME LATER: weekly, Sunday 05:17 UTC. The off-the-hour minute avoids the
  # cron stampede at :00, when GitHub's queues are most congested.
  # schedule:
  #   - cron: "17 5 * * 0"

# Least privilege: the action commits github-metrics.svg back to this repo.
permissions:
  contents: write

concurrency:
  group: metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Render profile metrics
        uses: lowlighter/metrics@v3.34
        with:
          # Authentication
          token: ${{ secrets.METRICS_TOKEN }}
          # Lets the action commit the generated file using the workflow's own
          # GITHUB_TOKEN, so METRICS_TOKEN never needs write access.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: erfzrezr
          filename: github-metrics.svg
          committer_message: "chore(metrics): refresh github-metrics.svg"

          # Look and feel: matches the terminal / SOC dark direction of the README.
          template: classic
          # IANA zone for Morocco; there is no Africa/Rabat. Country granularity only.
          # Needed only if plugin_habits is enabled below, which is time-of-day aware.
          config_timezone: Africa/Casablanca
          base: header, activity, community, repositories, metadata

          # Language breakdown. Kept modest: the account is new, so a huge
          # language chart would only advertise how little is there yet.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          # Habits / activity heatmap. Comment this in once there are a few
          # months of commits; before then it renders nearly empty.
          # plugin_habits: yes
          # plugin_habits_from: 200
          # plugin_habits_charts: yes
